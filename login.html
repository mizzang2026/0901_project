<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Jules의 기록 블로그 로그인 페이지입니다."><title>로그인 | Jules의 기록</title>
  <link rel="stylesheet" href="./css/style.css?v=20260928-2"><script src="./js/header.js?v=20260928-1" defer></script>
  <script src="./js/main.js?v=20260914-4" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">본문 바로가기</a>
  <div id="site-header"></div>
  <main id="main-content" class="account-page">
    <section class="content-heading"><p class="eyebrow">WELCOME BACK</p><h1>로그인</h1><p>작성한 글과 프로필을 관리하려면 로그인하세요.</p></section>
    <div class="form-layout">
      <form id="login-form" class="form-card" action="https://script.google.com/macros/s/AKfycbx8hwlqo8uhicyeuL9Z-LzllfJZRwnrniT_0CTAmazlUwempT1dwFtCjJoWW2mP6upp/exec" method="post">
        <input type="hidden" name="action" value="login">
        <div class="form-field"><label for="login-email">이메일</label><input id="login-email" name="email" type="email" autocomplete="email" required></div>
        <div class="form-field"><label for="login-password">비밀번호</label><input id="login-password" name="password" type="password" autocomplete="current-password" required></div>
        <button class="button button-primary" type="submit">로그인</button>
        <p class="form-help form-status" role="status" aria-live="polite"></p><p class="auth-switch">처음 방문하셨나요? <a href="./signup.html">회원가입</a></p>
      </form>
      <aside class="side-note"><h2>로그인 기능</h2><p>가입한 이메일과 비밀번호로 로그인하면 프로필 관리와 게시글 작성 기능을 사용할 수 있습니다.</p></aside>
    </div>
  </main>
  <footer class="site-footer"><p>© <span id="current-year"></span> Jules</p><p>배우고, 만들고, 기록하는 중입니다.</p></footer>
</body>
</html>
