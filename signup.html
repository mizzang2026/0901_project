<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Jules의 기록 블로그 회원가입 페이지입니다."><title>회원가입 | Jules의 기록</title>
  <link rel="stylesheet" href="./css/style.css?v=20260928-2"><script src="./js/header.js?v=20260928-1" defer></script>
  <script src="./js/main.js?v=20260914-4" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">본문 바로가기</a>
  <div id="site-header"></div>
  <main id="main-content" class="account-page">
    <section class="content-heading"><p class="eyebrow">JOIN THE BLOG</p><h1>회원가입</h1><p>새 계정을 만들고 블로그 활동을 시작하세요.</p></section>
    <div class="form-layout">
      <form id="signup-form" class="form-card" action="https://script.google.com/macros/s/AKfycbx8hwlqo8uhicyeuL9Z-LzllfJZRwnrniT_0CTAmazlUwempT1dwFtCjJoWW2mP6upp/exec" method="post">
        <input type="hidden" name="action" value="signup">
        <div class="form-field"><label for="signup-name">이름</label><input id="signup-name" name="name" type="text" autocomplete="name" required></div>
        <div class="form-field"><label for="signup-email">이메일</label><input id="signup-email" name="email" type="email" autocomplete="email" required></div>
        <div class="form-field"><label for="signup-password">비밀번호</label><input id="signup-password" name="password" type="password" autocomplete="new-password" minlength="8" required><p class="form-help">영문과 숫자를 포함해 8자 이상 입력하세요.</p></div>
        <div class="form-field"><label for="signup-confirm">비밀번호 확인</label><input id="signup-confirm" name="password-confirm" type="password" autocomplete="new-password" minlength="8" required></div>
        <button class="button button-primary" type="submit">계정 만들기</button>
        <p class="form-help form-status" role="status" aria-live="polite"></p><p class="auth-switch">이미 계정이 있나요? <a href="./login.html">로그인</a></p>
      </form>
      <aside class="side-note"><h2>연동 준비 중</h2><p>현재는 화면 구조만 완성된 상태입니다. Google Sheets와 Apps Script를 연결한 뒤 실제 회원 정보 저장 기능을 적용합니다.</p></aside>
    </div>
  </main>
  <footer class="site-footer"><p>© <span id="current-year"></span> Jules</p><p>배우고, 만들고, 기록하는 중입니다.</p></footer>
</body>
</html>
