<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Jules의 기록 블로그 게시글 작성 페이지입니다."><title>게시글 작성 | Jules의 기록</title>
  <link rel="stylesheet" href="./css/style.css"><script src="./js/header.js?v=20260928-1" defer></script>
  <script src="./js/main.js?v=20260914-4" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">본문 바로가기</a>
  <div id="site-header"></div>
  <main id="main-content" class="account-page">
    <section class="content-heading"><p class="eyebrow">NEW POST</p><h1>게시글 작성</h1><p>배운 내용과 생각을 새로운 글로 기록합니다.</p></section>
    <div class="form-layout">
      <form id="post-form" class="form-card" action="#" method="post">
        <input id="post-id" name="id" type="hidden">
        <div class="form-field"><label for="post-title">제목</label><input id="post-title" name="title" type="text" placeholder="게시글 제목을 입력하세요" required></div>
        <div class="form-field"><label for="post-category">분류</label><select id="post-category" name="category"><option>AI 활용</option><option>Q &amp; A</option><option>입트영</option><option>일 상</option></select></div>
        <div class="form-field"><label for="post-content">내용</label><textarea id="post-content" name="content" placeholder="오늘 배운 내용과 과정을 작성하세요" required></textarea></div>
        <button class="button button-primary" type="submit">게시글 저장</button><p class="form-help form-status" role="status"></p>
      </form>
      <aside class="side-note"><h2>저장 위치</h2><p>작성한 글은 현재 브라우저에 저장되어 메인·목록·상세 페이지에 반영됩니다.</p></aside>
    </div>
  </main>
  <footer class="site-footer"><p>© <span id="current-year"></span> Jules</p><p>배우고, 만들고, 기록하는 중입니다.</p></footer>
</body>
</html>
